name: 2 - Build and publish EPG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Diagnose Server 2 VOD transport
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install request library
        run: python -m pip install --only-binary=:all: requests==2.32.5
      - name: Check provider response status and schema only
        env:
          SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
          SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
          SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
          ALLOW_INSECURE_PANEL_HTTP: ${{ vars.ALLOW_INSECURE_PANEL_HTTP || 'false' }}
        run: python -u scripts/probe_provider_transport.py
