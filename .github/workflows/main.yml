name: Update TiviMate and SKY TV App EPG v8.4
run-name: EPG refresh v8.4 (${{ github.event_name }})

on:
  # Build immediately when an approved mapping or builder file changes.
  push:
    branches:
      - main
    paths:
      - "mappings/server_1_final_mapping.csv"
      - "mappings/server_2_final_mapping.csv"
      - "mappings/server_3_final_mapping.csv"
      - "config/epg_sources.json"
      - "config/channel_icons.csv"
      - "assets/logos/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"

  # One complete refresh every day at 4:37 AM Toronto time.
  schedule:
    - cron: "37 4 * * *"
      timezone: "America/Toronto"

  # Also allow a manual refresh from the Actions page.
  workflow_dispatch:

concurrency:
  group: skytv-epg-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build approved TiviMate XMLTV and SKY TV app JSON files
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SERVER_1_BASE_URL: ${{ secrets.SERVER_1_BASE_URL }}
      SERVER_1_USERNAME: ${{ secrets.SERVER_1_USERNAME }}
      SERVER_1_PASSWORD: ${{ secrets.SERVER_1_PASSWORD }}
      SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
      SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
      SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
      SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
      SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
      SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
      EPG_DOWNLOAD_WORKERS: "4"
      EPG_PUBLIC_BASE_URL: ${{ vars.EPG_PUBLIC_BASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tested dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build all approved TiviMate XMLTV files
        run: python -u scripts/build_all_servers.py

      - name: Build all compact SKY TV app JSON files
        run: python -u scripts/build_skytv_app_outputs.py

      - name: Retain private build reports for troubleshooting
        uses: actions/upload-artifact@v7
        with:
          name: skytv-epg-v8-4-build-reports-${{ github.run_id }}
          path: |
            .build/work/*/output/
            public/reports/*/*app_export_validation.json
            public/EPG/index.json
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy TiviMate and app EPG files to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
