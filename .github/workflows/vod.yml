name: Refresh VOD catalogs
run-name: "VOD refresh (${{ github.event_name }} #${{ github.run_number }})"

on:
  schedule:
    - cron: "47 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-skytv-vod-v1
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONHASHSEED: "0"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  ALLOW_INSECURE_PANEL_HTTP: ${{ vars.ALLOW_INSECURE_PANEL_HTTP || 'false' }}

jobs:
  build:
    name: Build movies, series, languages and release metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      artifact_id: ${{ steps.component_snapshot.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-sync.txt

      - name: Install pinned dependencies
        shell: bash
        run: |
          python -m pip install --only-binary=:all: \
            -r requirements.txt -r requirements-sync.txt
          python -m pip check

      - name: Run regression tests
        env:
          # Offline tests must not load a production cache restored later.
          SKYTV_CHANNEL_REGISTRY_DIR: ""
        run: python -m unittest discover -s tests -v

      - name: Fetch and validate all provider VOD inventories
        shell: bash
        env:
          SERVER_1_BASE_URL: ${{ secrets.SERVER_1_BASE_URL }}
          SERVER_1_USERNAME: ${{ secrets.SERVER_1_USERNAME }}
          SERVER_1_PASSWORD: ${{ secrets.SERVER_1_PASSWORD }}
          SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
          SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
          SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
        run: |
          set -euo pipefail
          vod_command=(
            python -u scripts/build_vod_catalogs.py
              --output-dir .build/vod-catalogs/public/VOD
              --snapshot-dir .build/vod-inputs
          )
          if [[ "${ALLOW_INSECURE_PANEL_HTTP,,}" == "true" ]]; then
            vod_command+=(--allow-insecure-http)
            echo "::warning::Provider VOD credentials may be sent over unencrypted HTTP."
          fi
          timeout --signal=TERM --kill-after=30s 15m "${vod_command[@]}"

      - name: Install prepared movie and series catalogs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install_vod_catalogs.py \
            --source .build/vod-catalogs/public/VOD \
            --output-dir public/VOD

      - name: Restore incremental SKYTVPlayer metadata cache
        id: vod_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/vod-cache
          key: skytvplayer-vod-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            skytvplayer-vod-v1-${{ runner.os }}-

      - name: Resolve due Server 1 movie metadata and release dates
        shell: bash
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SERVER_1_BASE_URL: ${{ secrets.SERVER_1_BASE_URL }}
          SERVER_1_USERNAME: ${{ secrets.SERVER_1_USERNAME }}
          SERVER_1_PASSWORD: ${{ secrets.SERVER_1_PASSWORD }}
        run: |
          set -euo pipefail
          resolve_command=(
            python -u scripts/build_skytvplayer_catalog.py
              --input-dir .build/vod-inputs
              --cache-dir .build/vod-cache
              --backfill-release-dates server_1
              --max-tmdb-requests 3000
              --backfill-max-seconds 600
              --resolution-limit 300
              --resolution-report-dir .build/vod-resolution
              --resolve-provider-details
              --max-provider-detail-requests 40
          )
          if [[ "${ALLOW_INSECURE_PANEL_HTTP,,}" == "true" ]]; then
            resolve_command+=(--allow-insecure-http)
          fi
          timeout --signal=TERM --kill-after=30s 12m "${resolve_command[@]}"

      - name: Retain sanitized movie resolution reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vod-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/vod-resolution/resolution_queue.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Build SKYTVPlayer movie and TV home database
        id: skytvplayer_catalog
        shell: bash
        env:
          SERVER_1_BASE_URL: ${{ secrets.SERVER_1_BASE_URL }}
          SERVER_1_USERNAME: ${{ secrets.SERVER_1_USERNAME }}
          SERVER_1_PASSWORD: ${{ secrets.SERVER_1_PASSWORD }}
          SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
          SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
          SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          app_command=(
            python -u scripts/build_skytvplayer_catalog.py
              --input-dir .build/vod-inputs
              --output-dir public/skytvplayer
              --cache-dir .build/vod-cache
              --fetch-series-details
              --tmdb-workers 3
          )
          if [[ "${ALLOW_INSECURE_PANEL_HTTP,,}" == "true" ]]; then
            app_command+=(--allow-insecure-http)
          fi
          if [[ -x /usr/bin/time ]]; then
            app_command=(/usr/bin/time -f "SkyTVPlayer peak RSS KiB: %M" "${app_command[@]}")
          fi
          timeout --signal=TERM --kill-after=30s 15m "${app_command[@]}"

      - name: Audit verified identities by server and language
        run: python scripts/audit_vod_identity_coverage.py --catalog-dir public/skytvplayer --output public/skytvplayer/identity_coverage.json --github-summary

      - name: Verify files contain no passwords, private URLs, or credential fields
        id: public_secret_scan
        if: always()
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SERVER_1_BASE_URL: ${{ secrets.SERVER_1_BASE_URL }}
          SERVER_1_USERNAME: ${{ secrets.SERVER_1_USERNAME }}
          SERVER_1_PASSWORD: ${{ secrets.SERVER_1_PASSWORD }}
          SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
          SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
          SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/scan_public_secrets.py

      - name: Validate independent VOD component
        run: bash scripts/check_publication.sh vod

      - name: Save incremental SKYTVPlayer metadata cache
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/vod-cache
          key: skytvplayer-vod-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Seal validated vod component
        run: python scripts/publication_snapshots.py package --component vod --source-dir public --output-dir .build/vod-snapshot

      - name: Retain validated vod component
        id: component_snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vod-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/vod-snapshot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish vod with the last valid counterpart
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-component.yml
    with:
      component: vod
      artifact-id: ${{ needs.build.outputs.artifact_id }}
    secrets: inherit
