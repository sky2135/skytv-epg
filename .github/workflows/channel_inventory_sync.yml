name: 1 - Sync channels to Google Sheet
run-name: "Manual channel sync #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      update_google_sheet:
        description: "Add missing channels to Google Sheet"
        required: true
        default: false
        type: boolean
      recheck_existing_review:
        description: "Recheck channels already marked REVIEW"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - dry-run
          - apply
      recheck_server:
        description: "Server backlog to recheck"
        required: true
        default: server_1
        type: choice
        options:
          - server_1
          - all
          - server_2
          - server_3
      use_gemini_ai:
        description: "Ask Gemini about unresolved recheck candidates"
        required: true
        default: false
        type: boolean
      ai_review_limit:
        description: "Maximum unresolved channels sent to Gemini"
        required: true
        default: "25"
        type: choice
        options:
          - "10"
          - "25"
          - "50"

# This workflow never commits or pushes. Its only optional writes are
# verified additions or bounded REVIEW-row updates in the Mappings tab, plus
# append-only additions to the Sync Alerts tab in the configured private Sheet.
concurrency:
  group: ${{ github.repository }}-skytv-epg-v1
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONHASHSEED: "0"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

  GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
  GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB || 'Mappings' }}
  ALLOW_INSECURE_PANEL_HTTP: ${{ vars.ALLOW_INSECURE_PANEL_HTTP || 'false' }}
  # New-row appends and existing-REVIEW updates are independent controls.
  REQUEST_SHEET_WRITE: ${{ inputs.update_google_sheet }}
  REQUEST_REVIEW_UPDATE: ${{ inputs.recheck_existing_review == 'apply' }}
  REVIEW_RECHECK_MODE: ${{ inputs.recheck_existing_review }}
  REVIEW_RECHECK_SERVER: ${{ inputs.recheck_server }}
  USE_GEMINI_AI: ${{ inputs.use_gemini_ai }}
  AI_REVIEW_LIMIT: ${{ inputs.ai_review_limit }}
  EPG_ALL_SOURCE_URL: >-
    https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz
  EPG_ALL_CATALOG_URL: >-
    https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.txt

jobs:
  sync:
    name: Compare all provider lineups with the private Sheet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-sync.txt

      - name: Check settings without printing secrets
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SERVER_1_BASE_URL: ${{ secrets.SERVER_1_BASE_URL }}
          SERVER_1_USERNAME: ${{ secrets.SERVER_1_USERNAME }}
          SERVER_1_PASSWORD: ${{ secrets.SERVER_1_PASSWORD }}
          SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
          SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
          SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlsplit

          def required(name: str) -> str:
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"Required setting {name} is missing.")
              return value

          sheet_id = required("GOOGLE_SHEET_ID")
          if not re.fullmatch(r"[A-Za-z0-9_-]{20,}", sheet_id):
              raise SystemExit("GOOGLE_SHEET_ID is not valid.")

          tab = required("GOOGLE_SHEET_TAB")
          if (
              len(tab) > 100
              or any(ord(char) < 32 for char in tab)
              or any(char in "[]:*?/\\" for char in tab)
          ):
              raise SystemExit("GOOGLE_SHEET_TAB is not valid.")

          allow_http = required("ALLOW_INSECURE_PANEL_HTTP").casefold()
          if allow_http not in {"true", "false"}:
              raise SystemExit(
                  "ALLOW_INSECURE_PANEL_HTTP must be true or false."
              )

          write_requested = required("REQUEST_SHEET_WRITE").casefold()
          if write_requested not in {"true", "false"}:
              raise SystemExit("update_google_sheet must be true or false.")

          recheck_mode = required("REVIEW_RECHECK_MODE")
          if recheck_mode not in {"off", "dry-run", "apply"}:
              raise SystemExit(
                  "recheck_existing_review must be off, dry-run, or apply."
              )
          review_update_requested = required(
              "REQUEST_REVIEW_UPDATE"
          ).casefold()
          if review_update_requested not in {"true", "false"}:
              raise SystemExit("REVIEW update request is not valid.")
          if (recheck_mode == "apply") != (
              review_update_requested == "true"
          ):
              raise SystemExit("REVIEW update controls are inconsistent.")

          recheck_server = required("REVIEW_RECHECK_SERVER")
          if recheck_server not in {
              "server_1", "server_2", "server_3", "all"
          }:
              raise SystemExit("recheck_server is not valid.")

          use_gemini = required("USE_GEMINI_AI").casefold()
          if use_gemini not in {"true", "false"}:
              raise SystemExit("use_gemini_ai must be true or false.")
          if use_gemini == "true" and recheck_mode == "off":
              raise SystemExit(
                  "Gemini can be used only when REVIEW recheck is enabled."
              )

          ai_limit = required("AI_REVIEW_LIMIT")
          if ai_limit not in {"10", "25", "50"}:
              raise SystemExit("ai_review_limit must be 10, 25, or 50.")
          if use_gemini == "true":
              gemini_key = os.environ.get("GEMINI_API_KEY", "")
              if (
                  not gemini_key
                  or len(gemini_key) > 512
                  or any(character.isspace() for character in gemini_key)
                  or any(ord(character) < 33 for character in gemini_key)
              ):
                  raise SystemExit(
                      "GEMINI_API_KEY is missing or invalid. Add it as a "
                      "GitHub Actions secret; do not paste it into workflow inputs."
                  )

          source = urlsplit(required("EPG_ALL_SOURCE_URL"))
          if (
              source.scheme != "https"
              or source.hostname != "epgshare01.online"
              or source.path
                  != "/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz"
              or source.query
              or source.fragment
          ):
              raise SystemExit("Unexpected EPG_ALL_SOURCE_URL.")

          catalog = urlsplit(required("EPG_ALL_CATALOG_URL"))
          if (
              catalog.scheme != "https"
              or catalog.hostname != "epgshare01.online"
              or catalog.path
                  != "/epgshare01/epg_ripper_ALL_SOURCES1.txt"
              or catalog.query
              or catalog.fragment
          ):
              raise SystemExit("Unexpected EPG_ALL_CATALOG_URL.")

          try:
              service_account = json.loads(
                  required("GOOGLE_SERVICE_ACCOUNT_JSON")
              )
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  "GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON."
              ) from exc

          if service_account.get("type") != "service_account":
              raise SystemExit(
                  "GOOGLE_SERVICE_ACCOUNT_JSON is not a service-account key."
              )
          for field in ("client_email", "private_key", "token_uri"):
              value = service_account.get(field)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(
                      "GOOGLE_SERVICE_ACCOUNT_JSON is missing a required "
                      f"field: {field}."
                  )

          for number in (1, 2, 3):
              base_name = f"SERVER_{number}_BASE_URL"
              parsed = urlsplit(required(base_name))
              if parsed.scheme not in {"https", "http"} or not parsed.hostname:
                  raise SystemExit(
                      f"{base_name} must be a complete HTTP or HTTPS URL."
                  )
              if parsed.scheme == "http" and allow_http != "true":
                  raise SystemExit(
                      f"{base_name} uses HTTP. Set repository variable "
                      "ALLOW_INSECURE_PANEL_HTTP to true only if the provider "
                      "does not support HTTPS."
                  )
              if (
                  parsed.username
                  or parsed.password
                  or parsed.query
                  or parsed.fragment
              ):
                  raise SystemExit(
                      f"{base_name} must not contain credentials, a query, "
                      "or a fragment."
                  )
              required(f"SERVER_{number}_USERNAME")
              required(f"SERVER_{number}_PASSWORD")
          PY

      - name: Install pinned dependencies
        shell: bash
        run: |
          python -m pip install --only-binary=:all: \
            -r requirements.txt -r requirements-sync.txt
          python -m pip check

      - name: Test channel synchronization and automatic EPG matching
        run: |
          python -m unittest \
            tests.test_sync_channel_inventory \
            tests.test_auto_match_inventory \
            tests.test_auto_match_shortlists \
            tests.test_learned_alias_memory \
            tests.test_auto_match_v1 \
            tests.test_epg_catalog_stream \
            tests.test_epg_spool_reuse \
            tests.test_ai_review_gemini \
            tests.test_native_epg_review \
            tests.test_matcher_regression \
            -v

      - name: Download the combined EPG guide and its official ID catalog once
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/skytv-epg-v1"
          mkdir -p "$source_dir"
          python - <<'PY'
          import os
          from pathlib import Path

          from scripts import build_epg_streaming as streaming
          from scripts import epg_catalog_stream as catalog_stream

          destination = (
              Path(os.environ["RUNNER_TEMP"])
              / "skytv-epg-v1"
              / "epg_ripper_ALL_SOURCES1.xml.gz"
          )
          streaming.safe_download(
              os.environ["EPG_ALL_SOURCE_URL"],
              destination,
              maximum_bytes=streaming.MAX_SOURCE_COMPRESSED_BYTES,
              expected_gzip=True,
              allowed_host_suffixes=("epgshare01.online",),
          )
          catalog_destination = (
              Path(os.environ["RUNNER_TEMP"])
              / "skytv-epg-v1"
              / "epg_ripper_ALL_SOURCES1.txt"
          )
          streaming.safe_download(
              os.environ["EPG_ALL_CATALOG_URL"],
              catalog_destination,
              maximum_bytes=catalog_stream.MAX_CATALOG_TEXT_BYTES,
              expected_gzip=False,
              allowed_host_suffixes=("epgshare01.online",),
          )
          PY

      - name: Find new, changed, and missing channels
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SERVER_1_BASE_URL: ${{ secrets.SERVER_1_BASE_URL }}
          SERVER_1_USERNAME: ${{ secrets.SERVER_1_USERNAME }}
          SERVER_1_PASSWORD: ${{ secrets.SERVER_1_PASSWORD }}
          SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
          SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
          SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .build/channel-sync

          command=(
            python -u scripts/sync_channel_inventory.py
              --mode bootstrap
              --sheet-id "$GOOGLE_SHEET_ID"
              --sheet-tab "$GOOGLE_SHEET_TAB"
              --output-dir .build/channel-sync
              --snapshot-out .build/channel-sync/effective_mapping.csv
              --all-source-file
                "$RUNNER_TEMP/skytv-epg-v1/epg_ripper_ALL_SOURCES1.xml.gz"
              --all-source-catalog-file
                "$RUNNER_TEMP/skytv-epg-v1/epg_ripper_ALL_SOURCES1.txt"
              --epgshare-spool-out
                "$RUNNER_TEMP/skytv-epg-v1/selected_epg.sqlite3"
              --review-recheck-mode "$REVIEW_RECHECK_MODE"
              --ai-review-limit "$AI_REVIEW_LIMIT"
              --minimum-server-channels
                server_1=4000
                server_2=10500
                server_3=9400
          )

          if [[ "$REVIEW_RECHECK_SERVER" == "all" ]]; then
            command+=(
              --review-recheck-servers server_1 server_2 server_3
            )
          else
            command+=(--review-recheck-servers "$REVIEW_RECHECK_SERVER")
          fi

          # Native-panel validation is automatic only inside an explicit
          # REVIEW recheck. Server 1 is deliberately excluded because its
          # native guide is forbidden by policy.
          if [[ "$REVIEW_RECHECK_MODE" != "off" ]]; then
            case "$REVIEW_RECHECK_SERVER" in
              server_2|server_3|all)
                command+=(--validate-native-review)
                ;;
            esac
          fi

          if [[ "${USE_GEMINI_AI,,}" == "true" ]]; then
            command+=(--use-gemini-ai)
          fi

          if [[ "${ALLOW_INSECURE_PANEL_HTTP,,}" == "true" ]]; then
            command+=(--allow-insecure-http)
            echo "::warning::Provider credentials may be sent over unencrypted HTTP."
          fi

          if [[ "${REQUEST_SHEET_WRITE,,}" == "true" ]]; then
            command+=(--write-to-sheet)
          fi

          # Existing REVIEW updates are controlled solely by the explicit
          # apply mode above; they do not require new-channel appends.

          "${command[@]}"

      - name: Verify reports contain no passwords, private URLs, or credential fields
        id: secret_scan
        if: always()
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SERVER_1_BASE_URL: ${{ secrets.SERVER_1_BASE_URL }}
          SERVER_1_USERNAME: ${{ secrets.SERVER_1_USERNAME }}
          SERVER_1_PASSWORD: ${{ secrets.SERVER_1_PASSWORD }}
          SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
          SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
          SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import base64
          from collections import Counter
          import gzip
          import html
          import json
          import math
          import os
          import re
          import stat
          import zlib
          from pathlib import Path
          from urllib.parse import quote, quote_plus, urlsplit

          failure = "Generated report failed its credential-safety check."
          output_dir = Path(".build/channel-sync")
          if not output_dir.exists():
              raise SystemExit(0)
          if output_dir.is_symlink() or not output_dir.is_dir():
              raise SystemExit(failure)

          raw_account = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "")
          try:
              account = json.loads(raw_account)
          except (TypeError, json.JSONDecodeError):
              raise SystemExit(failure) from None
          if not isinstance(account, dict):
              raise SystemExit(failure)

          def encoded_variants(value: str) -> set[bytes]:
              variants = {value}
              for ensure_ascii in (False, True):
                  rendered = json.dumps(value, ensure_ascii=ensure_ascii)
                  variants.update((rendered, rendered[1:-1]))
              csv_inner = value.replace('"', '""')
              variants.update((csv_inner, f'"{csv_inner}"'))
              variants.update(
                  (
                      html.escape(value, quote=False),
                      html.escape(value, quote=True),
                      value.replace("&", "&amp;")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                      .replace('"', "&quot;")
                      .replace("'", "&apos;"),
                  )
              )
              for rendered in (quote(value, safe=""), quote_plus(value, safe="")):
                  variants.add(rendered)
                  variants.add(
                      re.sub(
                          r"%[0-9A-Fa-f]{2}",
                          lambda match: match.group(0).lower(),
                          rendered,
                      )
                  )
              return {item.encode("utf-8") for item in variants if item}

          def url_variants(value: str) -> set[bytes]:
              variants = {value, quote(value, safe=""), quote_plus(value, safe="")}
              for rendered in tuple(variants):
                  variants.add(
                      re.sub(
                          r"%[0-9A-Fa-f]{2}",
                          lambda match: match.group(0).lower(),
                          rendered,
                      )
                  )
              return {item.encode("utf-8") for item in variants if item}

          # Usernames can be ordinary words, so short/common usernames are
          # matched only in credential-shaped fields and URLs. Passwords are
          # always matched globally below: a false alarm is safer than ever
          # uploading a configured password.
          def distinctive_provider_value(value: str) -> bool:
              raw = value.encode("utf-8")
              if len(raw) < 10:
                  return False
              counts = Counter(raw)
              entropy_bits = -sum(
                  count * math.log2(count / len(raw))
                  for count in counts.values()
              )
              classes = sum(
                  (
                      any(character.islower() for character in value),
                      any(character.isupper() for character in value),
                      any(character.isdigit() for character in value),
                      any(not character.isalnum() for character in value),
                  )
              )
              return entropy_bits >= 40 and (classes >= 2 or len(raw) >= 16)

          def value_alternative(value: str) -> bytes:
              variants = sorted(encoded_variants(value), key=len, reverse=True)
              return b"(?:" + b"|".join(re.escape(item) for item in variants) + b")"

          structured_patterns: list[re.Pattern[bytes]] = []

          def add_labeled_patterns(labels: tuple[str, ...], value: str) -> None:
              if not value:
                  return
              label = b"(?:" + b"|".join(
                  re.escape(item.encode("ascii")) for item in labels
              ) + b")"
              target = value_alternative(value)
              boundary = rb"(?![A-Za-z0-9._~%+-])"
              structured_patterns.extend(
                  (
                      re.compile(
                          rb'(?i:"' + label + rb'")[ \t\r\n]{0,16}:'
                          rb'[ \t\r\n]{0,16}["\']?' + target + boundary
                      ),
                      re.compile(
                          rb"(?<![A-Za-z0-9_])(?i:" + label + rb")"
                          rb"(?![A-Za-z0-9_])[ \t]{0,8}[=:][ \t]{0,8}[\"']?"
                          + target
                          + boundary
                      ),
                      re.compile(
                          rb"(?i:<[ \t]*" + label
                          + rb"(?:[ \t][^>]{0,64})?>)[ \t\r\n]{0,16}"
                          + target
                          + boundary
                      ),
                  )
              )

          raw_tokens: set[bytes] = set()
          casefold_tokens: set[bytes] = set()
          google_values = [raw_account]
          for field in ("client_email", "private_key", "private_key_id"):
              value = account.get(field)
              if isinstance(value, str) and value:
                  google_values.append(value)
          for value in google_values:
              raw_tokens.update(encoded_variants(value))

          gemini_api_key = os.environ.get("GEMINI_API_KEY", "")
          if gemini_api_key:
              raw_tokens.update(encoded_variants(gemini_api_key))

          maximum_structured_value = 0
          for number in (1, 2, 3):
              base_url = os.environ.get(f"SERVER_{number}_BASE_URL", "").strip()
              username = os.environ.get(f"SERVER_{number}_USERNAME", "").strip()
              password = os.environ.get(f"SERVER_{number}_PASSWORD", "")
              parsed_base = urlsplit(base_url)
              if parsed_base.hostname:
                  casefold_tokens.add(
                      parsed_base.hostname.casefold().encode("utf-8")
                  )
              for base_variant in {
                  base_url,
                  base_url.rstrip("/"),
                  parsed_base.netloc,
                  parsed_base.hostname or "",
              } - {""}:
                  raw_tokens.update(encoded_variants(base_variant))
              username_variants = encoded_variants(username) if username else set()
              password_variants = encoded_variants(password) if password else set()
              maximum_structured_value = max(
                  maximum_structured_value,
                  max(
                      (
                          len(item)
                          for item in username_variants | password_variants
                      ),
                      default=0,
                  ),
              )
              if distinctive_provider_value(username):
                  raw_tokens.update(username_variants)
              # Every password is intentionally global. The inventory command
              # requires at least four characters so unsafe passwords can be
              # rotated instead of weakening this check.
              raw_tokens.update(password_variants)
              add_labeled_patterns(("username", "user", "login", "user_name"), username)
              add_labeled_patterns(("password", "pass", "passwd", "pwd"), password)
              if username and password:
                  for user_variant in url_variants(username):
                      for password_variant in url_variants(password):
                          raw_tokens.update(
                              {
                                  b"://" + user_variant + b":" + password_variant + b"@",
                                  b"/live/" + user_variant + b"/" + password_variant + b"/",
                                  b"/" + user_variant + b"/" + password_variant + b"/",
                              }
                          )
                  basic = base64.b64encode(
                      f"{username}:{password}".encode("utf-8")
                  )
                  raw_tokens.update({b"Basic " + basic, b"basic " + basic})

          tokens = tuple(sorted(raw_tokens, key=len, reverse=True))
          if not tokens or not structured_patterns:
              raise SystemExit(failure)
          overlap = max(
              max(len(token) for token in tokens) - 1,
              512 + (2 * maximum_structured_value),
          )
          raw_pattern = re.compile(
              b"(?:" + b"|".join(re.escape(token) for token in tokens) + b")"
          )
          casefold_pattern = (
              re.compile(
                  b"(?:"
                  + b"|".join(
                      re.escape(token)
                      for token in sorted(casefold_tokens, key=len, reverse=True)
                  )
                  + b")"
              )
              if casefold_tokens
              else None
          )
          structured_pattern = re.compile(
              b"(?:"
              + b"|".join(pattern.pattern for pattern in structured_patterns)
              + b")"
          )
          structured_labels = (
              b"username", b"user_name", b"password", b"passwd",
              b"login", b"user", b"pass", b"pwd",
          )
          structured_span = 512 + (2 * maximum_structured_value)

          def has_structured_token(window: bytes, lowered: bytes) -> bool:
              word_bytes = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_"
              for label in structured_labels:
                  offset = 0
                  while True:
                      position = lowered.find(label, offset)
                      if position < 0:
                          break
                      after = position + len(label)
                      quoted = (
                          position > 0
                          and after < len(lowered)
                          and lowered[position - 1] == 34
                          and lowered[after] == 34
                      )
                      before = position - 1
                      while before >= 0 and lowered[before] in b" \t":
                          before -= 1
                      element = before >= 0 and lowered[before] == 60
                      left_boundary = (
                          position == 0 or lowered[position - 1] not in word_bytes
                      )
                      right_boundary = (
                          after == len(lowered) or lowered[after] not in word_bytes
                      )
                      separator = after
                      while (
                          separator < len(lowered)
                          and separator - after <= 8
                          and lowered[separator] in b" \t"
                      ):
                          separator += 1
                      assignment = (
                          left_boundary
                          and right_boundary
                          and separator - after <= 8
                          and separator < len(lowered)
                          and lowered[separator] in b"=:"
                      )
                      if quoted or element or assignment:
                          start = max(0, position - 2)
                          stop = min(len(window), position + structured_span)
                          if structured_pattern.search(window[start:stop]):
                              return True
                      offset = position + 1
              return False

          def contains_token(path: Path) -> bool:
              tail = b""
              opener = gzip.open if path.suffix.casefold() == ".gz" else open
              with opener(path, "rb") as handle:
                  while True:
                      chunk = handle.read(1024 * 1024)
                      if not chunk:
                          return False
                      window = tail + chunk
                      lowered = window.lower()
                      if (
                          raw_pattern.search(window)
                          or (
                              casefold_pattern is not None
                              and casefold_pattern.search(lowered)
                          )
                          or has_structured_token(window, lowered)
                      ):
                          return True
                      tail = window[-overlap:] if overlap else b""

          def annotation_path(path: Path) -> str:
              return (
                  str(path)
                  .replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
                  .replace(":", "%3A")
                  .replace(",", "%2C")
              )

          try:
              files = sorted(output_dir.rglob("*"))
              for path in files:
                  if path.is_symlink():
                      raise OSError
                  mode = path.lstat().st_mode
                  if stat.S_ISDIR(mode):
                      continue
                  if not stat.S_ISREG(mode):
                      raise OSError
                  if contains_token(path):
                      print(
                          f"::error file={annotation_path(path)}::{failure}",
                          flush=True,
                      )
                      raise SystemExit(1)
          except (OSError, EOFError, gzip.BadGzipFile, zlib.error):
              raise SystemExit(failure) from None

          print("Channel-sync report safety scan passed.")
          PY

      - name: Add channel-sync summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(".build/channel-sync/summary.json")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write("### Channel sync\n\n")
              if not path.is_file():
                  handle.write("No summary was produced. Open the failed step above.\n")
                  raise SystemExit(0)

              payload = json.loads(path.read_text(encoding="utf-8"))
              statuses = payload.get("channel_status_by_server")
              if not isinstance(statuses, dict):
                  raise SystemExit("Compact channel status is missing from summary.json.")

              def count(stats, key):
                  value = stats.get(key)
                  if isinstance(value, bool) or not isinstance(value, int):
                      raise SystemExit(f"Invalid compact channel count: {key}.")
                  if value < 0 or value > 250_000:
                      raise SystemExit(f"Out-of-range compact channel count: {key}.")
                  return value

              handle.write("| Server | Total channels | EPGShare enabled | Server EPG enabled | To review | Other / placeholder |\n")
              handle.write("|---|---:|---:|---:|---:|---:|\n")
              totals = {
                  "provider_channels": 0,
                  "epgshare_enabled": 0,
                  "native_enabled": 0,
                  "needs_review": 0,
                  "excluded_or_placeholder": 0,
              }
              for server_id in ("server_1", "server_2", "server_3"):
                  stats = statuses.get(server_id)
                  if not isinstance(stats, dict):
                      raise SystemExit(f"Compact status is missing {server_id}.")
                  available = stats.get("provider_available")
                  if not isinstance(available, bool):
                      raise SystemExit(f"Invalid availability status for {server_id}.")
                  label = server_id.replace("_", " ").title()
                  if not available:
                      handle.write(f"| {label} | Unavailable | — | — | — | — |\n")
                      continue
                  values = {key: count(stats, key) for key in totals}
                  if any(value > values["provider_channels"] for value in values.values()):
                      raise SystemExit(f"Compact counts do not reconcile for {server_id}.")
                  if (
                      values["epgshare_enabled"]
                      + values["native_enabled"]
                      + values["needs_review"]
                      + values["excluded_or_placeholder"]
                      != values["provider_channels"]
                  ):
                      raise SystemExit(f"Compact counts do not reconcile for {server_id}.")
                  for key, value in values.items():
                      totals[key] += value
                  handle.write(
                      f"| {label} | {values['provider_channels']:,} | "
                      f"{values['epgshare_enabled']:,} | "
                      f"{values['native_enabled']:,} | "
                      f"{values['needs_review']:,} | "
                      f"{values['excluded_or_placeholder']:,} |\n"
                  )
              handle.write(
                  f"| **Total** | **{totals['provider_channels']:,}** | "
                  f"**{totals['epgshare_enabled']:,}** | "
                  f"**{totals['native_enabled']:,}** | "
                  f"**{totals['needs_review']:,}** | "
                  f"**{totals['excluded_or_placeholder']:,}** |\n"
              )
              handle.write(
                  "\n_Enabled means an output-eligible mapping, not proof that "
                  "programmes exist right now. To review includes missing or "
                  "unresolved mappings and channels blocked by open safety "
                  "alerts. Other / placeholder contains dummy-guide and "
                  "deliberately excluded channels._\n"
              )

              handle.write("\n### This run\n\n")
              mode = str(payload.get("review_recheck_mode", "off"))
              recheck_servers = payload.get("review_recheck_servers", [])
              if not isinstance(recheck_servers, list) or any(
                  server_id not in {"server_1", "server_2", "server_3"}
                  for server_id in recheck_servers
              ):
                  raise SystemExit("Invalid REVIEW server scope in summary.json.")
              native_review_enabled = mode in {"dry-run", "apply"} and bool(
                  {"server_2", "server_3"}.intersection(recheck_servers)
              )
              if mode == "dry-run":
                  handle.write(
                      "- Total verified EPG matches found: "
                      f"**{int(payload.get('review_recheck_safe_matches', 0)):,}** "
                      "(preview only)\n"
                  )
              elif mode == "apply":
                  handle.write(
                      "- Total verified EPG matches enabled: "
                      f"**{int(payload.get('review_recheck_safe_matches_persisted', 0)):,}**\n"
                  )
              else:
                  handle.write(
                      "- New channels safely enabled: "
                      f"**{int(payload.get('auto_matched_rows', 0)):,}**\n"
                  )
              if native_review_enabled:
                  native_candidates = count(payload, "native_review_candidates")
                  native_verified = count(payload, "native_review_verified")
                  native_unavailable = count(
                      payload, "native_review_source_unavailable"
                  )
                  handle.write(
                      f"- Native EPG candidates found: **{native_candidates:,}**\n"
                  )
                  handle.write(
                      f"- Native EPG matches verified: **{native_verified:,}**"
                      + (" (preview only)\n" if mode == "dry-run" else "\n")
                  )
                  if mode == "apply":
                      native_persisted = count(
                          payload, "native_review_persisted"
                      )
                      handle.write(
                          "- Native EPG matches enabled (included in total above): "
                          f"**{native_persisted:,}**\n"
                      )
                  handle.write(
                      "- Native EPG sources unavailable: "
                      f"**{native_unavailable:,}**\n"
                  )
              deferred = int(payload.get("review_recheck_deferred_rows", 0))
              if deferred:
                  handle.write(
                      f"- Safe matches waiting for the next apply run: **{deferred:,}**\n"
                  )

              if bool(payload.get("ai_review_enabled", False)):
                  found = int(payload.get("ai_review_high_suggestions_found", 0))
                  saved = int(payload.get("ai_review_high_suggestions_persisted", 0))
                  unresolved = int(payload.get("ai_review_abstained_rows", 0))
                  handle.write(
                      f"- Gemini: **{found:,}** suggestions found; "
                      f"**{saved:,}** saved for approval; "
                      f"**{unresolved:,}** unresolved\n"
                  )
                  ai_errors = int(payload.get("ai_review_error_rows", 0))
                  if ai_errors:
                      handle.write(
                          f"- Gemini unavailable or rejected: **{ai_errors:,}**\n"
                      )
              if int(payload.get("new_rows", 0)):
                  handle.write(
                      f"- New channels found: **{int(payload['new_rows']):,}**; "
                      f"added to Sheet: **{int(payload.get('appended_rows', 0)):,}**\n"
                  )
              handle.write(
                  f"- Safety alerts: **{int(payload.get('new_sync_alerts', 0)):,}** new; "
                  f"**{int(payload.get('open_sync_alerts', 0)):,}** open\n"
              )
              failures = payload.get("provider_failures", {})
              failure_count = len(failures) if isinstance(failures, dict) else 0
              if failure_count:
                  handle.write(f"- Provider checks unavailable: **{failure_count}**\n")
          PY

      # The repository is public, so Actions artifacts are not used as private
      # storage. Full inventories and mapping snapshots remain only on the
      # temporary runner and are destroyed with the job.
      - name: Retain aggregate channel-sync summary
        if: ${{ always() && steps.secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skytv-channel-sync-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/channel-sync/summary.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
