name: Inspect unmatched VOD metadata

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    name: Read two saved movie identities without lookups or publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-sync.txt
      - name: Restore the cache used by the production run
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build/vod-cache
          key: skytvplayer-vod-v1-Linux-39964367413-1
          fail-on-cache-miss: true
      - name: Isolate preceding cache
        run: mv .build/vod-cache .build/cache-before
      - name: Restore the cache saved by the production run
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build/vod-cache
          key: skytvplayer-vod-v1-Linux-40095954027-1
          fail-on-cache-miss: true
      - name: Inspect two records without external metadata requests
        run: |
          python scripts/probe_two_movie_cache.py \
            --input data/diagnostics/server3-two-movies-20261024.json \
            --before .build/cache-before --after .build/vod-cache \
            --output .build/movie-cache-probe/report.json
      - name: Retain bounded read-only diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server3-two-movie-cache-${{ github.run_id }}
          path: .build/movie-cache-probe/report.json
          if-no-files-found: error
          retention-days: 7
