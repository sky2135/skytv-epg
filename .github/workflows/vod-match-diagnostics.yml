name: Inspect sanitized Server 3 movie source provenance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-vod-source-provenance-20261024
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned client dependency
        run: python -m pip install --only-binary=:all: requests==2.32.5
      - name: Trace three movie source records without publishing
        env:
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
          ALLOW_INSECURE_PANEL_HTTP: ${{ vars.ALLOW_INSECURE_PANEL_HTTP }}
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -euo pipefail
          command=(python -u scripts/trace_vod_source_provenance.py --live --load-server-config --server server_3 --output .build/vod-provenance/report.json)
          if [[ "${ALLOW_INSECURE_PANEL_HTTP,,}" == "true" ]]; then
            command+=(--allow-insecure-http)
          fi
          timeout --signal=TERM --kill-after=30s 6m "${command[@]}"
      - name: Retain only sanitized provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vod-source-provenance-${{ github.run_id }}
          path: .build/vod-provenance/report.json
          if-no-files-found: error
          retention-days: 7
