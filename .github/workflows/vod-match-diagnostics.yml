name: Read-only Server 3 current movie inventory probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-server3-inventory-probe-20261025
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned client dependency
        run: |
          python -m pip install --only-binary=:all: requests==2.32.5
      - name: Read current inventory and retain only totals and sample hashes
        env:
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
          ALLOW_INSECURE_PANEL_HTTP: ${{ vars.ALLOW_INSECURE_PANEL_HTTP }}
          PYTHONIOENCODING: utf-8
        run: |
          timeout --signal=TERM --kill-after=30s 6m python -u scripts/probe_server3_inventory.py
      - name: Retain only sanitized inventory probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server3-inventory-${{ github.run_id }}
          path: .build/server3-inventory/report.json
          if-no-files-found: error
          retention-days: 7
