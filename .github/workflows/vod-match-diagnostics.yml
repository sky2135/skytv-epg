name: Smoke test two movie identities and resumable VOD batches
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.repository }}-vod-source-provenance-20261024
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated smoke revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned client dependency
        run: |
          python -m pip install --only-binary=:all: requests==2.32.5
      - name: Verify two real movies and resume two tiny private batches
        env:
          GH_TOKEN: ${{ github.token }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 24m python -u scripts/smoke_vod_enrichment.py
      - name: Retain only whitelisted smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vod-enrichment-smoke-${{ github.run_id }}
          path: .build/vod-smoke/results/*.json
          if-no-files-found: error
          retention-days: 7
