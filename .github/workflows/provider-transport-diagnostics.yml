name: Diagnose provider transport

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only diagnostic scope
        type: choice
        options:
          - live
          - vod_evidence
          - vod_identity_coverage
          - vod_recent_samples
          - vod_raw_samples
        default: live

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-sync.txt
      - name: Restore exact preceding VOD cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build/vod-cache
          key: skytvplayer-vod-v1-Linux-39821419972-1
          fail-on-cache-miss: true
      - name: Keep preceding cache isolated
        run: mv .build/vod-cache .build/cache-before
      - name: Restore exact corrected VOD cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build/vod-cache
          key: skytvplayer-vod-v1-Linux-39824081615-1
          fail-on-cache-miss: true
      - name: Inspect saved proof without HTTP or cache writes
        run: |
          python -u scripts/diagnose_verification_loss_cache.py \
            --input data/diagnostics/lost38-matcher-inputs.json \
            --before-cache .build/cache-before \
            --after-cache .build/vod-cache \
            --previous-module scripts/vod_tmdb_previous_diagnostic.py \
            --output .build/loss-report/report.json
      - name: Retain bounded diagnostic report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vod-cache-loss-${{ github.run_id }}
          path: .build/loss-report/report.json
          if-no-files-found: error
          retention-days: 7
