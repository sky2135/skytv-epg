name: Publish independent component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      artifact-id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Compose and deploy validated live and VOD snapshots
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Hold the lock through restore, composition AND deployment. Builds overlap;
    # a waiting publisher always reads its counterpart after acquiring this lock.
    concurrency:
      group: ${{ github.repository }}-skytv-pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      COMPONENT: ${{ inputs.component }}
      CURRENT_ARTIFACT_ID: ${{ inputs.artifact-id }}
      EPG_PUBLIC_BASE_URL: ${{ vars.EPG_PUBLIC_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-sync.txt

      - name: Install pinned dependencies
        shell: bash
        run: |
          python -m pip install --only-binary=:all: \
            -r requirements.txt -r requirements-sync.txt
          python -m pip check

      - name: Restore current component and last valid published counterpart
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            live) other=vod ;;
            vod) other=live ;;
            *) echo '::error::Unexpected publication component'; exit 1 ;;
          esac
          python scripts/component_artifacts.py current --artifact-id "$CURRENT_ARTIFACT_ID" --component "$COMPONENT" --destination ".build/${COMPONENT}-snapshot"
          python scripts/component_artifacts.py previous --component "$other" --destination ".build/${other}-snapshot"

      - name: Compose components and refresh app live-guide references
        run: python scripts/publication_snapshots.py compose --live-dir .build/live-snapshot --vod-dir .build/vod-snapshot --output-dir public

      - name: Verify files contain no passwords, private URLs, or credential fields
        id: public_secret_scan
        if: always()
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SERVER_1_BASE_URL: ${{ secrets.SERVER_1_BASE_URL }}
          SERVER_1_USERNAME: ${{ secrets.SERVER_1_USERNAME }}
          SERVER_1_PASSWORD: ${{ secrets.SERVER_1_PASSWORD }}
          SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
          SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
          SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/scan_public_secrets.py

      - name: Validate complete publication
        run: bash scripts/check_publication.sh all

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload validated GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Deploy the complete validated publication
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
