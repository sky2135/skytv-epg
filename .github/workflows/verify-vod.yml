name: Inspect TMDB appended translation response shape
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check only public response structure
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.parse
          token=os.environ.get('TMDB_READ_ACCESS_TOKEN','');key=os.environ.get('TMDB_API_KEY','')
          if not(token or key):raise SystemExit('TMDB credential unavailable')
          headers={'Accept':'application/json'}
          if token:headers['Authorization']='Bearer '+token
          for identifier in (297222,11430):
              query={'append_to_response':'translations'}
              if not token:query['api_key']=key
              request=urllib.request.Request('https://api.themoviedb.org/3/movie/'+str(identifier)+'?'+urllib.parse.urlencode(query),headers=headers)
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read(2*1024*1024)
                  data=json.loads(raw);resource=data.get('translations') or {};rows=resource.get('translations') or []
                  print(json.dumps({'requestedId':identifier,'outerId':data.get('id'),'outerTitle':data.get('title'),'resourceKeys':list(resource),'nestedIdPresent':'id' in resource,'nestedId':resource.get('id'),'translationCount':len(rows),'sampleDataKeys':list(rows[0].get('data',{})) if rows else [],'englishTitles':[v.get('data',{}).get('title') for v in rows if v.get('iso_639_1')=='en']},ensure_ascii=True))
              except Exception as error:
                  print(json.dumps({'requestedId':identifier,'errorType':type(error).__name__}));raise SystemExit(1)
              time.sleep(1)
          PY
