name: Recover unavailable native EPG
run-name: Native guide recovery (${{ github.event_name }})

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

# Shares the live writer lock and preserves queued refresh/inventory runs.
# The encrypted cache is saved before this job releases the shared lock.
concurrency:
  group: ${{ github.repository }}-skytv-epg-v1
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-sync.txt
      - name: Restore encrypted native guide cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/native-panel-cache.enc
          key: private-native-guide-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            private-native-guide-v1-${{ runner.os }}-
      - name: Open private native guides and cooldowns
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: >-
          python scripts/private_panel_cache.py restore
          --directory "${{ runner.temp }}/skytv-native-panel-cache"
          --file .build/native-panel-cache.enc
      - name: Probe only unavailable native guide sources
        env:
          GH_TOKEN: ${{ github.token }}
          EPG_PUBLIC_BASE_URL: ${{ vars.EPG_PUBLIC_BASE_URL }}
          SKYTV_PANEL_CACHE_DIR: ${{ runner.temp }}/skytv-native-panel-cache
          ALLOW_INSECURE_PANEL_HTTP: ${{ vars.ALLOW_INSECURE_PANEL_HTTP || 'false' }}
          SERVER_2_BASE_URL: ${{ secrets.SERVER_2_BASE_URL }}
          SERVER_2_USERNAME: ${{ secrets.SERVER_2_USERNAME }}
          SERVER_2_PASSWORD: ${{ secrets.SERVER_2_PASSWORD }}
          SERVER_3_BASE_URL: ${{ secrets.SERVER_3_BASE_URL }}
          SERVER_3_USERNAME: ${{ secrets.SERVER_3_USERNAME }}
          SERVER_3_PASSWORD: ${{ secrets.SERVER_3_PASSWORD }}
        run: python -u scripts/recover_native_epg.py probe --report .build/native-recovery-report.json
      - name: Encrypt validated native guides and provider cooldowns
        id: native_cache_seal
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SKYTV_PANEL_CACHE_DIR: ${{ runner.temp }}/skytv-native-panel-cache
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.private_panel_cache import seal
          ready = seal(Path(os.environ['SKYTV_PANEL_CACHE_DIR']), Path('.build/native-panel-cache.enc'))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write('ready=' + str(ready).lower() + '\n')
          print('Private native guide cache sealed.' if ready else 'Private cache unavailable; provider checks still apply.')
          PY
      - name: Save encrypted native guide cache
        if: ${{ always() && steps.native_cache_seal.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/native-panel-cache.enc
          key: private-native-guide-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Request a refresh only after verified source recovery
        env:
          GH_TOKEN: ${{ github.token }}
          EPG_PUBLIC_BASE_URL: ${{ vars.EPG_PUBLIC_BASE_URL }}
        run: python scripts/recover_native_epg.py dispatch --report .build/native-recovery-report.json
      - name: Retain aggregate recovery report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/native-recovery-report.json
          if-no-files-found: warn
          retention-days: 7
