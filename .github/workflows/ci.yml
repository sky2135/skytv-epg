name: Validate repository changes

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "config/**"
      - "knowledge/**"
      - "matching_lab/**"
      - "requirements*.txt"
      - "MATCHER_INTEGRITY.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "config/**"
      - "knowledge/**"
      - "matching_lab/**"
      - "requirements*.txt"
      - "MATCHER_INTEGRITY.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  tests:
    name: Offline regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-sync.txt

      - name: Check whitespace in proposed changes
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$DIFF_BASE" =~ ^0+$ ]] || [[ -z "$DIFF_BASE" ]]; then
            git diff --check HEAD
          else
            git diff --check "$DIFF_BASE" HEAD
          fi

      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: \
            -r requirements.txt -r requirements-sync.txt
          python -m pip check

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
